services:
  pi:
    build: .
    image: pi
    stdin_open: true
    tty: true
    volumes:
    - ./pi:/home/pi/.pi
    - ./skills:/home/pi/.agents/skills:ro
    - ./models.json:/home/pi/.pi/agent/models.json:ro
    - ${WORKSPACE_PATH:-}:/workspace
    environment:
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    working_dir: /workspace
