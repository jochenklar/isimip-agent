---
services:
  pi:
    container_name: isimip-pi
    image: isimip-pi:latest
    build:
      context: .
      target: isimip-pi
      args:
        UID: ${AGENT_UID:-1000}
        GID: ${AGENT_GID:-1000}
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${DATASETS_PATH:-./datasets}:/datasets:ro
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - pi:/home/agent
      - ./skills:/home/agent/.pi/agent/skills
      - ${MODELS_JSON:-./default/models.json}:/home/agent/.pi/agent/models.json
    env_file:
      - .env
    profiles: [pi]

  claude:
    container_name: isimip-claude
    image: isimip-claude:latest
    build:
      context: .
      target: isimip-claude
      args:
        UID: ${AGENT_UID:-1000}
        GID: ${AGENT_GID:-1000}
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${DATASETS_PATH:-./datasets}:/datasets:ro
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - claude:/home/agent
      - ./skills:/home/agent/.claude/skills
    env_file:
      - .env
    profiles: [claude]

  codex:
    container_name: isimip-codex
    image: isimip-codex:latest
    build:
      context: .
      target: isimip-codex
      args:
        UID: ${AGENT_UID:-1000}
        GID: ${AGENT_GID:-1000}
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${DATASETS_PATH:-./datasets}:/datasets:ro
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - codex:/home/agent
      - ./skills:/home/agent/.codex/skills/
    env_file:
      - .env
    profiles: [codex]

  tau:
    container_name: isimip-tau
    image: isimip-tau:latest
    build:
      context: .
      target: isimip-tau
      args:
        UID: ${AGENT_UID:-1000}
        GID: ${AGENT_GID:-1000}
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${DATASETS_PATH:-./datasets}:/datasets:ro
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - tau:/home/agent
      - ./skills:/home/agent/.tau/skills
      - ${CATALOG_TOML:-./default/catalog.toml}:/home/agent/.tau/catalog.toml
    env_file:
      - .env
    profiles: [tau]

volumes:
  pi:
  claude:
  codex:
  tau:
